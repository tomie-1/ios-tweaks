name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install dpkg ldid || brew install dpkg

      - name: Build tweaks
        run: |
          set -euo pipefail
          VERSION="1.0.0"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist
          shopt -s nullglob
          for d in tweaks/*/; do
            [ -f "${d}tweak.env" ] || continue
            echo "=== building $d (version $VERSION) ==="
            VERSION="$VERSION" bash scripts/build_tweak.sh "$d" dist
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweaks-${{ github.sha }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
