name: build

on:
  push:
    branches: [main]
    paths:
      - "tweaks/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tweaks: ${{ steps.plan.outputs.tweaks }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Plan changed tweaks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          all=$(for d in tweaks/*/; do [ -f "${d}tweak.env" ] && basename "$d"; done | sort)

          full=false
          reason=""
          if [ "$EVENT" != "push" ]; then
            full=true; reason="event=$EVENT"
          elif [ "$REF" != "refs/heads/main" ]; then
            full=true; reason="ref=$REF"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            full=true; reason="initial push"
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            full=true; reason="base commit missing (force push?)"
          fi

          changed=""
          if [ "$full" = false ]; then
            infra=$(git diff --name-only "$BEFORE" "$SHA" -- scripts .github/workflows || true)
            if [ -n "$infra" ]; then
              full=true; reason="build infra changed"
            else
              changed=$(git diff --name-only "$BEFORE" "$SHA" -- tweaks \
                | awk -F/ 'NF > 2 && $1 == "tweaks" { print $2 }' | sort -u || true)
            fi
          fi

          if [ "$full" = true ]; then
            list="$all"
          else
            list=""
            for t in $all; do
              if printf '%s\n' "$changed" | grep -qxF -- "$t"; then
                list="${list}${t}"$'\n'
              fi
            done
          fi

          json=$(printf '%s' "$list" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mode: full=$full${reason:+ ($reason)}"
          echo "tweaks: $json"
          {
            echo "full=$full"
            echo "tweaks=$json"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.tweaks != '[]'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        tweak: ${{ fromJSON(needs.discover.outputs.tweaks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid || brew install dpkg
      - name: Short sha
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.tweak }}
        run: |
          set -euo pipefail
          VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          mkdir -p "dist/${{ matrix.tweak }}"
          VERSION="$VERSION" bash scripts/build_tweak.sh "tweaks/${{ matrix.tweak }}" "dist/${{ matrix.tweak }}"
      - name: Upload artifact (${{ matrix.tweak }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tweak }}-${{ steps.vars.outputs.sha }}
          path: dist/${{ matrix.tweak }}/*
          if-no-files-found: error

  publish:
    needs: [discover, build]
    # 即使没有新插件要构建，也要跑发布：删除/归档插件时需要从 repo 分支清掉旧包。
    if: always() && needs.discover.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: List packages declared in source
        run: |
          set -euo pipefail
          : > /tmp/src_ids.txt
          for f in tweaks/*/tweak.env; do
            [ -f "$f" ] || continue
            ( unset PKG_ID; . "$f"; echo "$PKG_ID" )
          done >> /tmp/src_ids.txt
          sort -u /tmp/src_ids.txt -o /tmp/src_ids.txt
          echo "declared packages:"; sed 's/^/  /' /tmp/src_ids.txt
      - name: Switch to repo branch
        run: |
          set -euo pipefail
          cp scripts/build_repo.sh /tmp/build_repo.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin repo
          git checkout -B repo origin/repo
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish to repo branch
        run: |
          set -euo pipefail
          mkdir -p debs scripts
          cp /tmp/build_repo.sh scripts/build_repo.sh
          chmod +x scripts/build_repo.sh

          shopt -s nullglob
          rebuilt=""
          for f in artifacts/*.deb; do
            rebuilt="$rebuilt$(dpkg-deb -f "$f" Package)"$'\n'
          done
          rebuilt=$(printf '%s' "$rebuilt" | sort -u | sed '/^$/d')
          echo "rebuilt packages:"; printf '%s\n' "$rebuilt" | sed 's/^/  /'

          echo "drop stale debs of rebuilt packages:"
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            find debs -type f -name "${pkg}_*.deb" -print -delete
          done <<< "$rebuilt"

          echo "prune packages no longer declared in source:"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            pkg=$(dpkg-deb -f "$f" Package 2>/dev/null || echo "")
            if ! grep -qxF -- "$pkg" /tmp/src_ids.txt; then
              echo "  prune $f"
              rm -f "$f"
            fi
          done < <(find debs -type f -name '*.deb' | sort)

          for f in artifacts/*.deb; do
            arch=$(dpkg-deb -f "$f" Architecture)
            mkdir -p "debs/$arch"
            cp "$f" "debs/$arch/"
            chmod 644 "debs/$arch/$(basename "$f")"
          done

          bash scripts/build_repo.sh .
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "repo: update packages (run ${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7})"
            git push origin repo
          fi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
