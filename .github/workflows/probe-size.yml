name: probe-size

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SRC="tweaks/soul/SoulTweak.m"
          BASE="-isysroot $SDK -dynamiclib -fobjc-arc -fmodules -Wno-deprecated-declarations -Wno-unused-function -framework Foundation -framework UIKit -framework WebKit"
          echo "clang: $(xcrun clang --version | head -1)"
          echo "sdk: $SDK"
          try() {
            label="$1"; shift
            if xcrun clang -target arm64-apple-ios15.0 $BASE "$@" -install_name @executable_path/x.dylib -o /tmp/o.dylib "$SRC" 2>/tmp/err; then
              raw=$(stat -f%z /tmp/o.dylib)
              cp /tmp/o.dylib /tmp/o2.dylib; strip -x /tmp/o2.dylib 2>/dev/null || true
              sx=$(stat -f%z /tmp/o2.dylib)
              cp /tmp/o.dylib /tmp/o3.dylib; strip -x -S /tmp/o3.dylib 2>/dev/null || true
              sxs=$(stat -f%z /tmp/o3.dylib)
              printf '%-40s raw=%-8s strip-x=%-8s strip-xS=%-8s\n' "$label" "$raw" "$sx" "$sxs"
            else
              printf '%-40s FAILED: %s\n' "$label" "$(tail -1 /tmp/err)"
            fi
          }
          try "baseline -Os" -Os
          try "-Os -Wl,-dead_strip" -Os -Wl,-dead_strip
          try "-Os hidden+dead_strip" -Os -fvisibility=hidden -Wl,-dead_strip
          try "-Oz" -Oz
          try "-Oz hidden+dead_strip" -Oz -fvisibility=hidden -Wl,-dead_strip
          try "-O2" -O2
          try "-Os no-unwind" -Os -fno-unwind-tables -fno-asynchronous-unwind-tables
          try "-Os -Wl,-x" -Os -Wl,-x
          try "-Os strip(-Wl,-S)" -Os -Wl,-S
          try "-O1" -O1
          try "-Os -flto" -Os -flto