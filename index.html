<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>tomie iOS Repo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --card: #141b23;
      --text: #f5f7fa;
      --muted: #8b98a8;
      --accent: #3ddc97;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #16222d 0, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    main {
      width: min(100%, 360px);
      padding: 28px 24px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 24px;
      background: rgba(20, 27, 35, .92);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
      text-align: center;
    }
    .icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, #3ddc97, #1e9e6a);
      box-shadow: 0 10px 30px rgba(61, 220, 151, .25);
      color: #06130d;
    }
    .icon svg { width: 34px; height: 34px; }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -.02em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      border-radius: 15px;
      background: var(--accent);
      color: #06130d;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .button:active { transform: scale(.98); }
    code {
      display: block;
      margin-top: 16px;
      color: #6f7c8c;
      font-size: 11px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/>
        <path d="m4.3 7.5 7.7 4.4 7.7-4.4M12 21v-9.1"/>
      </svg>
    </div>
    <h1>tomie iOS Repo</h1>
    <p>SoulTweak 与常用 iOS 插件</p>
    <a class="button" href="sileo://source/https://tomie-1.github.io/ios-tweaks/">添加到 Sileo</a>
    <code>https://tomie-1.github.io/ios-tweaks/</code>
  </main>
</body>
</html>
